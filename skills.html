<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Skills - Red Moon</title>
<link rel="stylesheet" href="style.css" />
<style>
body { margin:0; background:#000; }
.red-moon-bg {
  position: fixed; inset: -8%; width: 116%; height: 116%; z-index: -3;
  background-image: url('red-moon.jpeg'), url('https://images.unsplash.com/photo-1532693322450-2cb5c511067d?w=800&q=80');
  background-size: cover; background-position: center; background-repeat: no-repeat;
  animation: bgMove 35s ease-in-out infinite alternate;
}
@keyframes bgMove { 0% { transform: scale(1) translate(0%,0%); } 100% { transform: scale(1.15) translate(-1.5%, -1.5%); } }
.overlay { position: fixed; inset: 0; z-index: -2; background: radial-gradient(ellipse at center, rgba(0,0,0,0.2) 20%, rgba(0,0,0,0.75) 90%); }
.sec { max-width: 400px; margin: 0 auto; padding: 16px; padding-bottom: 110px; position: relative; z-index:2; overflow: hidden; }
.title { text-align: center; font-size: 28px; font-weight: 900; color: white; }
.title span { color: #ff0033; text-shadow: 0 0 18px rgba(255, 0, 51, 0.8); animation: glowPulse 2s infinite; display: inline-block; }
@keyframes glowPulse { 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.05) } }
.typing { text-align: center; font-size: 9px; color: #ff0033; letter-spacing: 2.5px; margin: 8px 0; height: 14px; font-weight: 800; }
.typing:after { content: '|'; animation: blink 0.7s infinite; }
@keyframes blink { 50%{ opacity:0 } }
.skill-list { display: grid; gap: 14px; margin-top: 20px; perspective: 1200px; }

/* BOX NA MAY KITA NA IKOT COLOR SA GILID */
.skill-row {
  position: relative;
  display: flex; align-items: center; gap: 14px;
  background: transparent;
  padding: 2.5px;
  border-radius: 14px;
  overflow: hidden;
  transform-style: preserve-3d;
  animation: pasok 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  opacity: 0;
}
.skill-row:nth-child(1){ animation-delay:.1s; --rot:#ff0033; --rot2:#ff6a00; }
.skill-row:nth-child(2){ animation-delay:.25s; --rot:#00e5ff; --rot2:#0080ff; }
.skill-row:nth-child(3){ animation-delay:.4s; --rot:#ffaa00; --rot2:#ffee00; }
.skill-row:nth-child(4){ animation-delay:.55s; --rot:#a855f7; --rot2:#ec4899; }
.skill-row:nth-child(5){ animation-delay:.7s; --rot:#22c55e; --rot2:#00ffaa; }

@keyframes pasok { from{ transform:translateY(30px) scale(0.9); opacity:0 } to{ transform:translateY(0) scale(1); opacity:1 } }

/* KITA NA IKOT COLOR SA BOX */
.skill-row::before {
  content: '';
  position: absolute;
  inset: -100%;
  background: conic-gradient(from 0deg, var(--rot) 0deg, var(--rot2) 50deg, transparent 90deg, transparent 310deg, var(--rot) 360deg);
  animation: ikotColor 2.2s linear infinite;
}
@keyframes ikotColor { to { transform: rotate(360deg); } }

.skill-inner {
  position: relative; z-index: 2;
  width: 100%;
  display: flex; align-items: center; gap: 14px;
  background: rgba(20,8,10,0.92);
  backdrop-filter: blur(12px);
  padding: 14px;
  border-radius: 12px;
}

/* BALIK SA UNA - UMIKOT SILA ICON TULAD SA UNA MONG CODE */
.skill-icon {
  width: 56px; height: 56px; min-width: 56px;
  display: grid; place-items: center; font-size: 24px; border-radius: 14px;
  box-shadow: 0 0 18px rgba(255,0,51,0.5);
}
.skill-row:nth-child(1) .skill-icon { background: radial-gradient(circle at 30% 30%, #ff2a5a, #ff0033); animation: ikotY 3s linear infinite; }
.skill-row:nth-child(2) .skill-icon { background: radial-gradient(circle at 30% 30%, #38bdf8, #0077ff); box-shadow: 0 0 18px rgba(0,119,255,0.5); animation: ikotX 3.5s ease-in-out infinite; }
.skill-row:nth-child(3) .skill-icon { background: radial-gradient(circle at 30% 30%, #facc15, #ff8a00); box-shadow: 0 0 18px rgba(255,170,0,0.5); animation: ikotZ 2s linear infinite; }
.skill-row:nth-child(4) .skill-icon { background: radial-gradient(circle at 30% 30%, #c084fc, #9333ea); box-shadow: 0 0 18px rgba(168,85,247,0.5); animation: ikotFlip 2.8s ease-in-out infinite; }
.skill-row:nth-child(5) .skill-icon { background: radial-gradient(circle at 30% 30%, #4ade80, #16a34a); box-shadow: 0 0 18px rgba(34,197,94,0.5); animation: ikotAlog 2.2s ease-in-out infinite; }

@keyframes ikotY { from{ transform:rotateY(0) } to{ transform:rotateY(360deg) } }
@keyframes ikotX { 0%,100%{ transform:rotateX(0deg) } 50%{ transform:rotateX(180deg) } }
@keyframes ikotZ { from{ transform:rotateZ(0) } to{ transform:rotateZ(360deg) } }
@keyframes ikotFlip { 0%{ transform:rotateY(0) scale(1) } 50%{ transform:rotateY(180deg) scale(1.15) } 100%{ transform:rotateY(360deg) scale(1) } }
@keyframes ikotAlog { 0%,100%{ transform:rotate(0deg) translateY(0) } 25%{ transform:rotate(10deg) translateY(-4px) } 50%{ transform:rotate(-10deg) translateY(-2px) } 75%{ transform:rotate(6deg) translateY(-5px) } }

.skill-info { flex: 1; }
.skill-info b { font-size: 13px; color: white; display: block; }
.skill-info span { font-size: 9px; color: rgba(255,255,255,0.5); margin-top: 3px; display: block; }
.meter { height: 6px; background: rgba(255,255,255,0.08); margin-top: 10px; border-radius: 20px; overflow: hidden; }
.fill { height: 100%; background: linear-gradient(90deg, #ff0033, #ff6a00); width: 0; border-radius: 20px; animation: fillBar 1.8s forwards 1.2s; box-shadow: 0 0 12px #ff0033; }
.skill-row:nth-child(2) .fill { background: linear-gradient(90deg, #0077ff, #00e5ff); box-shadow: 0 0 12px #00e5ff; }
.skill-row:nth-child(3) .fill { background: linear-gradient(90deg, #ff8a00, #ffee00); box-shadow: 0 0 12px #ffaa00; }
.skill-row:nth-child(4) .fill { background: linear-gradient(90deg, #9333ea, #e879f9); box-shadow: 0 0 12px #a855f7; }
.skill-row:nth-child(5) .fill { background: linear-gradient(90deg, #16a34a, #4ade80); box-shadow: 0 0 12px #22c55e; }
@keyframes fillBar { to{ width:var(--w) } }
.skill-percent { font-weight: 900; font-size: 18px; min-width: 46px; text-align: right; }
.skill-row:nth-child(1) .skill-percent{color:#ff3355} .skill-row:nth-child(2) .skill-percent{color:#00e5ff} .skill-row:nth-child(3) .skill-percent{color:#ffaa00} .skill-row:nth-child(4) .skill-percent{color:#c084fc} .skill-row:nth-child(5) .skill-percent{color:#4ade80}

.bottom-wrap { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 92%; max-width: 360px; }
.bottom-pill { width: 100%; height: 58px; background: rgba(14,14,16,0.96); border: 1px solid rgba(255,0,51,0.3); border-radius: 30px; display: flex; justify-content: space-around; align-items: center; backdrop-filter: blur(14px); }
.bottom-pill a { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #ffffff55; font-size: 7px; font-weight: 800; width: 48px; }
.bottom-pill a svg { width: 20px; height: 20px; stroke: #ffffff80; fill: none; stroke-width: 1.7; }
.bottom-pill a.active { color: #ff2d55; }
.bottom-pill a.active svg { stroke: #ff2d55; filter: drop-shadow(0 0 6px #ff2d55); }
</style>
</head>
<body>
<div class="red-moon-bg"></div>
<div class="overlay"></div>
<nav style="background:rgba(0,0,0,.4);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,0,51,.2)">
  <div class="logo">MY<b>.WEBSITE</b></div>
  <button class="nav-logout" onclick="logout()" style="border-color:#ff0033;color:#ff0033"><span>EXIT</span></button>
</nav>
<div class="sec">
<h2 class="title">My <span>Skills</span></h2>
<div class="typing" id="typing"></div>
<div class="skill-list">
  <div class="skill-row" onclick="tapSkill(this)"><div class="skill-inner"><div class="skill-icon">🌐</div><div class="skill-info"><b>HTML - Expert</b><span>Semantic, responsive layout</span><div class="meter"><div class="fill" style="--w:90%"></div></div></div><div class="skill-percent">90%</div></div></div>
  <div class="skill-row" onclick="tapSkill(this)"><div class="skill-inner"><div class="skill-icon">🎨</div><div class="skill-info"><b>CSS - Designer</b><span>Animation, flex, grid master</span><div class="meter"><div class="fill" style="--w:85%"></div></div></div><div class="skill-percent">85%</div></div></div>
  <div class="skill-row" onclick="tapSkill(this)"><div class="skill-inner"><div class="skill-icon">⚡</div><div class="skill-info"><b>JavaScript - Logic</b><span>Interactive & smooth UX</span><div class="meter"><div class="fill" style="--w:70%"></div></div></div><div class="skill-percent">70%</div></div></div>
  <div class="skill-row" onclick="tapSkill(this)"><div class="skill-inner"><div class="skill-icon">🖼️</div><div class="skill-info"><b>Canva / Editing</b><span>Poster, logo, branding</span><div class="meter"><div class="fill" style="--w:88%"></div></div></div><div class="skill-percent">88%</div></div></div>
  <div class="skill-row" onclick="tapSkill(this)"><div class="skill-inner"><div class="skill-icon">📝</div><div class="skill-info"><b>MS Office Pro</b><span>Word, PPT, Excel expert</span><div class="meter"><div class="fill" style="--w:95%"></div></div></div><div class="skill-percent">95%</div></div></div>
</div>
</div>
<div class="bottom-wrap"><div class="bottom-pill"><a href="index.html"><svg viewBox="0 0 24 24"><path d="M3 10L12 3l9 7v10H15v-6H9v6H3z"/></svg>HOME</a><a href="gallery.html"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/></svg>PHOTO</a><a class="active" href="skills.html"><svg viewBox="0 0 24 24"><path d="M12 2l2.5 5.5L21 12l-6.5 4.5L12 22l-2.5-5.5L3 12l6.5-4.5L12 2z"/></svg>SKILLS</a><a href="goals.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2.5"/></svg>GOALS</a><a href="funfacts.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M8 13c1.2 1.5 3.8 1.5 5 0"/><circle cx="9" cy="9" r=".8" fill="white" stroke="none"/><circle cx="15" cy="9" r=".8" fill="white" stroke="none"/></svg>FUN</a><a href="contact.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3 19c0-2.5 2.2-4.5 6-4.5s6 2 6 4.5"/></svg>CONTACT</a></div></div>
<script>
const txt = "RED MOON SKILLS - SOUND  +  COLOR";
let i = 0; function type() { if (i < txt.length) { document.getElementById('typing').innerText = txt.substring(0, i + 1); i++; setTimeout(type, 50); } } type();
function logout() { localStorage.removeItem('blue_logged'); location.href = 'login.html'; }
function tapSkill(el){
  el.style.transform='scale(0.97)';
  if(navigator.vibrate) navigator.vibrate([20,30,20]);
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.frequency.value = 650; o.type='sine';
    g.gain.setValueAtTime(0.3, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.2);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.2);
  }catch(e){}
  setTimeout(()=>{ el.style.transform=''; }, 300);
}
</script>
</body>
</html>
